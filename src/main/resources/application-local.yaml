server:
  port: 8081

spring:
  application:
    name: USERSERVICE

  datasource:
    url: jdbc:postgresql://localhost:5432/userservice
    username: postgres
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect